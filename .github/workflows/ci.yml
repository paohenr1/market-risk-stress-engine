name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned build and report dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-bootstrap.txt -r requirements-report.txt

      - name: Install project
        run: python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Check dependency consistency
        run: python -m pip check

      - name: Check public commands
        run: |
          python -m market_risk --version
          python -m market_risk check-config --config configs/foundation.toml

      - name: Run tests including report rendering
        run: |
          python - <<'PY'
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun == 0 or result.skipped:
              raise SystemExit("CI requires at least one test and no skipped tests.")
          raise SystemExit(not result.wasSuccessful())
          PY

      - name: Compile Python modules
        run: python -m compileall -q src tools tests
