[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "market-risk-stress-engine"
version = "0.1.0"
description = "Educational market-variable projection and fixed-time portfolio stress diagnostics"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
market-risk = "market_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_risk = ["dashboard.html"]
